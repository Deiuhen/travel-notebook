<!doctype html>
<html lang="zh-CN" data-skin="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>出国旅行手账</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%88%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f6f1e7;--sf:#fffdf8;--bd:#2b2b2b;--ln:#e3dccd;--t1:#2b2b2b;--t2:#555;--t3:#8a8577;--ac:#d9480f;--al:#fff0d6;--ok:#2f9e44;--no:#c92a2a;--wa:#e8a400;--r:10px;--bw:1.5px;--sh:2px 3px 0 #2b2b2b}
[data-skin=bold]{--bg:#fbf7ee;--sf:#fff;--bd:#111;--ln:#111;--t1:#111;--t2:#333;--t3:#666;--ac:#5b3df5;--al:#ffe98a;--r:4px;--bw:2.5px;--sh:4px 4px 0 #111}
[data-skin=night]{--bg:#15171c;--sf:#1e2129;--bd:#3a3f4b;--ln:#2c313b;--t1:#e8e6e1;--t2:#b5b2aa;--t3:#7f7c75;--ac:#ff8a4c;--al:#3a2a1c;--ok:#51cf66;--no:#ff6b6b;--r:10px;--bw:1px;--sh:none}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;color:var(--t1);background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ac)}
[hidden]{display:none!important}
.wrap{max-width:980px;margin:0 auto;padding:24px 16px 80px}
header{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.tt{flex:1;min-width:240px}
#title{border:0;background:none;width:100%;padding:0;outline:none;font-size:26px;font-weight:700;letter-spacing:-.3px}
.sub{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.sub input{border:0;border-bottom:1px dashed var(--ln);background:none;outline:none;color:var(--t2);padding:2px 0;font-size:13px;width:9em}
.sub input[type=date]{width:auto}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{padding:6px 12px;font-size:12px;cursor:pointer;white-space:nowrap;background:var(--sf);border:var(--bw) solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);transition:transform .08s;text-decoration:none;color:var(--t1)}
.btn:active{transform:translate(1px,1px);box-shadow:none}
.btn.p{background:var(--ac);color:#fff;border-color:var(--bd)}
.btn.sm{padding:3px 8px;font-size:11px;box-shadow:none}
select.btn{padding:5px 8px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--t3);border:0;background:none;cursor:pointer;padding:4px 6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--t3);display:inline-block}
.sync[data-s=ok] i{background:var(--ok)}.sync[data-s=busy] i{background:var(--wa)}.sync[data-s=off] i{background:var(--no)}
.card{background:var(--sf);border:var(--bw) solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:16px}
.card>.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--ln)}
.card>.hd b{font-size:14px}
.meta{font-size:12px;color:var(--t3)}
#mems{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:2px;padding:2px 4px 2px 10px;font-size:12px;background:var(--sf);border:var(--bw) solid var(--bd);border-radius:999px}
.chip.me{background:var(--al)}
.chip input{border:0;background:none;outline:none;width:5.5em;padding:0}
.warn{font-size:12px;color:var(--ac);font-weight:600}
#tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px}
#tabs button{border:var(--bw) solid transparent;background:none;cursor:pointer;white-space:nowrap;font-size:14px;padding:6px 14px;border-radius:var(--r);color:var(--t2)}
#tabs button.on{background:var(--sf);border-color:var(--bd);color:var(--t1);font-weight:600;box-shadow:var(--sh)}
.scroll{overflow-x:auto}
table.grid{border-collapse:collapse;width:100%}
.grid th{text-align:left;white-space:nowrap;font-size:12px;font-weight:500;color:var(--t3);padding:6px 10px;border-bottom:1px solid var(--ln)}
.grid td{padding:0;border-bottom:1px solid var(--ln);vertical-align:middle}
.grid tr:last-child td{border-bottom:0}
.grid input,.grid select{width:100%;border:0;background:none;padding:9px 10px;outline:none;min-width:3em;font-size:13px}
.grid input:focus,.grid select:focus{background:var(--al)}
.grid .catrow td{background:var(--bg);font-size:12px;font-weight:600;color:var(--t2);padding:6px 10px}
.w-xs{width:44px}.w-s{width:86px}.w-m{width:120px}.w-l{width:170px}
.x{border:0;background:none;color:var(--t3);cursor:pointer;opacity:.35;padding:2px 8px;font-size:16px;line-height:1}
tr:hover .x,.chip:hover .x,.x:focus,.dayhd:hover .x,.lri:hover .x{opacity:1}
.add{border:0;background:none;color:var(--ac);cursor:pointer;padding:8px 12px;font-size:12px;font-weight:600}
.st{border:0;background:none;cursor:pointer;width:100%;padding:9px 4px;font-size:13px;white-space:nowrap}
.st[data-v="0"]{color:var(--t3)}.st[data-v="1"]{color:var(--ok);font-weight:600}.st[data-v="2"]{color:var(--no);text-decoration:line-through}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--al);color:var(--t2);white-space:nowrap}
.map{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font-size:15px;padding:6px;cursor:pointer;border:0;background:none}
.cellwrap{display:flex;align-items:center}
.cellwrap input{flex:1}
.dayhd{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--ln);background:var(--bg);flex-wrap:wrap}
.dayhd:first-child{border-top:0}
.dayhd .lbl{font-weight:700;font-size:13px}
.dayhd input{border:0;background:none;outline:none;font-size:13px;flex:1;min-width:8em}
.sum{display:flex;flex-wrap:wrap;gap:10px;padding:12px 14px}
.sum div{flex:1;min-width:120px;padding:10px 14px;background:var(--bg);border-radius:var(--r)}
.sum b{display:block;font-size:20px;letter-spacing:-.3px}
.sum span{font-size:12px;color:var(--t3)}
.settle{padding:0 14px 14px;margin:0;list-style:none}
.settle li{padding:6px 0;border-top:1px dashed var(--ln);font-size:13px}
.parts{display:flex;flex-wrap:wrap;gap:4px;padding:6px 10px}
.parts label{font-size:12px;padding:1px 8px;border:1px solid var(--ln);border-radius:999px;cursor:pointer;user-select:none;white-space:nowrap}
.parts label.on{background:var(--al);border-color:var(--bd)}
.parts input{display:none}
textarea{width:100%;min-height:55vh;border:0;outline:none;resize:vertical;line-height:1.8;padding:14px 16px;font-size:14px;background:none;border-radius:var(--r)}
.mapbox{position:relative;height:300px;border-radius:0 0 var(--r) var(--r);overflow:hidden;background:var(--bg)}
.mapbox iframe{border:0;width:100%;height:100%}
.rates{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;font-size:12px;color:var(--t2);border-bottom:1px solid var(--ln)}
.rates input{width:6em;border:1px solid var(--ln);background:var(--bg);border-radius:6px;padding:3px 6px;outline:none}
.rates input.cc{width:4.5em;text-transform:uppercase}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal .card{max-width:560px;width:100%;margin:0}
.modal .bd{padding:14px}
.modal input[readonly]{width:100%;border:1px solid var(--ln);background:var(--bg);border-radius:6px;padding:6px 8px;font-size:12px}
.invcode{font:700 30px/1.2 ui-monospace,Menlo,monospace;letter-spacing:4px;margin:4px 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.empty{padding:18px 14px;color:var(--t3);font-size:13px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--t1);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;z-index:10;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
/* landing */
.land{max-width:440px;margin:0 auto;padding:12vh 20px 60px;text-align:center}
.land h1{font-size:30px;margin:0 0 6px}
.land p{color:var(--t2);margin:0 0 24px}
.land .btn{font-size:14px;padding:10px 20px}
.lform{display:flex;gap:8px;justify-content:center;margin:18px 0 6px}
.lform input{flex:1;max-width:220px;border:var(--bw) solid var(--bd);border-radius:var(--r);background:var(--sf);padding:8px 12px;outline:none;text-transform:uppercase;letter-spacing:1px}
.lerr{color:var(--no);font-size:12px;min-height:1.4em}
.recent{text-align:left;margin-top:24px}
.lri{display:flex;align-items:center;border-top:1px solid var(--ln)}
.lri a{flex:1;display:flex;justify-content:space-between;padding:10px 4px;text-decoration:none;color:var(--t1)}
.lri a span{color:var(--t3);font-family:ui-monospace,Menlo,monospace;font-size:12px}
@media (max-width:600px){#title{font-size:22px}.mapbox{height:240px}.grid input,.grid select{padding:8px 6px}}
@media print{.tools,#tabs,.x,.add,.mapbox{display:none!important}}
</style>
</head>
<body>
<div id="landing" hidden><div class="land">
  <h1>✈ 出国旅行手账</h1>
  <p>免注册，把邀请码发给旅伴就能一起实时编辑。</p>
  <button class="btn p" id="lnNew">新建行程</button>
  <form class="lform" id="lnForm" autocomplete="off"><input id="lnCode" placeholder="输入邀请码 ABCD-EFGH" maxlength="200" autocapitalize="characters" spellcheck="false"><button class="btn" type="submit">进入</button></form>
  <div class="lerr" id="lnErr"></div>
  <div class="recent" id="lnRecent"></div>
</div></div>

<div class="wrap" id="app" hidden>
<header>
  <div class="tt">
    <input id="title" data-meta="title" placeholder="行程名，比如：东京 5 日">
    <div class="sub">
      <input data-meta="place" placeholder="目的地城市，如 Tokyo" title="会自动附加到地图搜索里，方便定位">
      <input type="date" data-meta="start" title="出发日期"><input type="date" data-meta="end" title="返回日期">
    </div>
  </div>
  <div class="tools">
    <button class="sync" id="sync" data-s="busy" title=""><i></i><span>连接中…</span></button>
    <a class="btn" href="#" id="homeBtn" title="所有行程 / 新建">行程列表</a>
    <button class="btn" data-act="skin">皮肤</button>
    <button class="btn" data-act="io">导入/导出</button>
    <button class="btn p" data-act="share">邀请</button>
  </div>
</header>
<div id="mems"></div>
<nav id="tabs"></nav>
<main id="view"></main>
</div>

<div class="modal" id="shareM" hidden><div class="card">
  <div class="hd"><b>邀请旅伴</b><button class="x" data-close>×</button></div>
  <div class="bd">
    <div class="meta">邀请码</div>
    <div class="invcode" id="invCode"></div>
    <div class="row"><button class="btn p" id="copyCode">复制邀请码</button><button class="btn" id="copyText">复制邀请文字</button></div>
    <div class="meta" style="margin-top:16px">链接</div>
    <div class="row"><input id="invLink" readonly style="flex:1"><button class="btn" id="copyLink">复制链接</button></div>
    <p class="meta">朋友打开链接，或在首页输入邀请码，就能和你一起实时编辑。<br>🔒 内容在浏览器里加密后才发到公共 Nostr 中继，只有拿到邀请码的人能解开——所以邀请码就是钥匙，只发给旅伴。</p>
  </div>
</div></div>

<div class="modal" id="ioM" hidden><div class="card">
  <div class="hd"><b>导入 / 导出</b><button class="x" data-close>×</button></div>
  <div class="bd">
    <p class="meta" style="margin-top:0">行程同时保存在这台设备和中继上。导出一份 JSON 当备份更保险。导入的 JSON 会变成一个新行程（新邀请码）。</p>
    <div class="row">
      <button class="btn" id="expJson">导出 JSON 备份</button>
      <label class="btn">导入 JSON<input type="file" id="impJson" accept=".json,application/json" hidden></label>
      <button class="btn" id="printBtn">打印 / 存为 PDF</button>
      <button class="btn" id="delTrip" style="color:var(--no)">从这台设备移除</button>
    </div>
  </div>
</div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/nostr-tools@2.10.4/lib/nostr.bundle.js"></script>
<script>
(function () {
'use strict';
var $ = function (s, r) { return (r || document).querySelector(s); };
var uid = function () { var a = crypto.getRandomValues(new Uint8Array(6)), s = ''; for (var i = 0; i < 6; i++) s += (a[i] % 36).toString(36); return s + Date.now().toString(36).slice(-3); };
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
function lsj(k, d) { try { return JSON.parse(ls(k)) || d; } catch (e) { return d; } }
var DEV = ls('gtrip:dev') || (function () { var d = uid(); ls('gtrip:dev', d); return d; })();
document.documentElement.dataset.skin = ls('gtrip:skin') || 'paper';

/* ================= 邀请码 ================= */
var AL = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
function norm(s) {
  s = String(s || '').trim(); var m = s.match(/#([A-Za-z0-9-]+)\s*$/); if (m) s = m[1];
  var c = s.toUpperCase().replace(/[\s\-_·.]/g, '');
  return /^[A-HJKMNP-Z2-9]{8}$/.test(c) ? c : '';
}
function newCode() { var a = crypto.getRandomValues(new Uint8Array(8)), c = ''; for (var i = 0; i < 8; i++) c += AL[a[i] % AL.length]; return c; }
function pretty(c) { return c.slice(0, 4) + '-' + c.slice(4); }

/* ================= 可合并文档 =================
   D: { key: [value, time, device] }，每个字段独立“后写者胜”。
   m|字段           行程信息
   r|币种           汇率（null = 删除）
   L|列表|id        记录存在（值 = 排序号；null = 已删除）
   F|列表|id|字段…  记录字段，可多级 */
var D = {}, T = null, ROOM = '', ME = '';
var LISTS = ['members', 'pack', 'book', 'days', 'items', 'wish', 'bills'];
var DEF = {
  members: { name: '' }, pack: { cat: '', name: '', shared: false, st: {}, who: '' },
  book: { type: '其他', date: '', detail: '', status: '未订', link: '' }, days: { label: '' },
  items: { day: '', time: '', what: '', where: '', wish: '' }, wish: { cat: '玩', name: '', where: '', link: '', note: '' },
  bills: { what: '', amt: '', cur: '', payer: '', parts: [] }
};
var META = { title: '', place: '', start: '', end: '', mode: 'transit', base: 'CNY', notes: '' };
function newer(a, b) { return !b || a[1] > b[1] || (a[1] === b[1] && a[2] > b[2]); }
function set(k, v) { var t = Math.max(Date.now(), D[k] ? D[k][1] + 1 : 0); D[k] = [v, t, DEV]; changed(); }
function build() {
  var t = JSON.parse(JSON.stringify(META)), recs = {};
  t.rates = {}; LISTS.forEach(function (l) { recs[l] = {}; t[l] = []; });
  var fs = [];
  for (var k in D) {
    var p = k.split('|'), v = D[k][0];
    if (p[0] === 'm') t[p[1]] = v;
    else if (p[0] === 'r') { if (v != null) t.rates[p[1]] = v; }
    else if (p[0] === 'L') { if (v != null && recs[p[1]]) { var r = JSON.parse(JSON.stringify(DEF[p[1]])); r.id = p[2]; r._o = v; recs[p[1]][p[2]] = r; } }
    else if (p[0] === 'F') fs.push([p, v]);
  }
  fs.forEach(function (f) {
    var p = f[0], r = recs[p[1]] && recs[p[1]][p[2]]; if (!r) return;
    for (var i = 3; i < p.length - 1; i++) { if (typeof r[p[i]] !== 'object' || r[p[i]] === null) r[p[i]] = {}; r = r[p[i]]; }
    r[p[p.length - 1]] = f[1];
  });
  LISTS.forEach(function (l) { t[l] = Object.keys(recs[l]).map(function (id) { return recs[l][id]; }).sort(function (a, b) { return a._o - b._o; }); });
  var dayIds = {}; t.days.forEach(function (d) { dayIds[d.id] = 1; });
  t.items = t.items.filter(function (it) { return dayIds[it.day]; });
  T = t;
}
function setM(f, v) { set('m|' + f, v); build(); }
function setF(l, id, f, v) { set('F|' + l + '|' + id + '|' + f, v); build(); }
function add(l, obj, o) {
  var id = obj.id || uid();
  set('L|' + l + '|' + id, o != null ? o : Date.now() + Math.random());
  flat(obj, 'F|' + l + '|' + id);
  build(); return id;
}
function flat(obj, pre) { for (var f in obj) { if (f === 'id' || f === '_o') continue; var v = obj[f]; if (v && typeof v === 'object' && !Array.isArray(v)) flat(v, pre + '|' + f); else set(pre + '|' + f, v); } }
function del(l, id) { set('L|' + l + '|' + id, null); build(); }
function merge(R) {
  var ch = false, ahead = false;
  for (var k in R) if (Array.isArray(R[k]) && newer(R[k], D[k])) { D[k] = R[k]; ch = true; }
  for (var k2 in D) if (newer(D[k2], R[k2])) { ahead = true; break; }
  return { changed: ch, ahead: ahead };
}

/* 默认内容（只有创建者生成一次） */
var PACK = [
  ['证件', '护照! 签证/入境材料! 身份证 信用卡(Visa/Master)! 外币现金 旅行保险单 机票/酒店确认单 证件照片备份'],
  ['电子', '转换插头 充电宝 充电器 数据线 eSIM/流量卡! 耳机 自拍杆'],
  ['洗漱', '牙刷 牙膏 洗面奶 洗发水 沐浴露 一次性毛巾'],
  ['护肤化妆', '防晒 卸妆 护肤品 化妆品 面膜'],
  ['衣物', '换洗衣物 睡衣 内衣/袜子 外套 拖鞋 好走的鞋'],
  ['药品', '感冒药 肠胃药 晕车药 创可贴 个人常用药'],
  ['其他', '纸巾/湿巾 雨伞 水杯 收纳袋 折叠购物袋 笔(填入境卡)']
];
var CURS = { CNY: 1, JPY: 0.048, KRW: 0.0052, THB: 0.2, SGD: 5.4, USD: 7.2, EUR: 7.8, GBP: 9.1, HKD: 0.92, MYR: 1.6, AUD: 4.7 };
function seed() {
  var n = 0, o = function () { return ++n; };
  ME = add('members', { name: '' }, o());
  PACK.forEach(function (c) {
    c[1].split(' ').forEach(function (x) {
      var must = /!$/.test(x); x = x.replace(/!$/, '');
      add('pack', { cat: c[0], name: x, shared: !must && /转换插头|充电宝|雨伞|洗发水|沐浴露|药/.test(x) }, o());
    });
  });
  ['去程', '住宿', '返程'].forEach(function (t) { add('book', { type: t }, o()); });
  add('days', {}, o());
}
/* 旧格式 / JSON 导入 → 文档 */
function fromPlain(t) {
  var n = 0, o = function () { return ++n; };
  ['title', 'place', 'start', 'end', 'mode', 'base', 'notes'].forEach(function (f) { if (t[f] != null && t[f] !== '') set('m|' + f, t[f]); });
  for (var c in (t.rates || {})) set('r|' + c, t.rates[c]);
  var strip = function (x, keys) { var r = {}; keys.forEach(function (k) { if (x[k] !== undefined) r[k] = x[k]; }); r.id = x.id; return r; };
  (t.members || []).forEach(function (x) { add('members', strip(x, ['name']), o()); });
  (t.pack || []).forEach(function (x) { add('pack', strip(x, ['cat', 'name', 'shared', 'st', 'who']), o()); });
  (t.book || []).forEach(function (x) { add('book', strip(x, ['type', 'date', 'detail', 'status', 'link']), o()); });
  (t.days || []).forEach(function (d) {
    add('days', strip(d, ['label']), o());

    '</table></div><button class="add" data-act="addwish">+ 想去</button></div>' + mapCard();
};
V.bill = function () {
  var ms = T.members, curList = [T.base].concat(Object.keys(T.rates).filter(function (c) { return c !== T.base; }));
  var rows = T.bills.map(function (b) {
    return '<tr><td>' + inp('bills', b.id, 'what', b.what, '项目') + '</td><td class="w-s">' + inp('bills', b.id, 'amt', b.amt, '金额') + '</td>' +
      '<td class="w-s">' + sel('bills', b.id, 'cur', b.cur || T.base, curList) + '</td>' +

      '<td><div class="parts">' + ms.map(function (m) { var on = b.parts.indexOf(m.id) >= 0; return '<label class="' + (on ? 'on' : '') + '"><input type="checkbox" data-act="part" data-id="' + b.id + '" data-m="' + m.id + '"' + (on ? ' checked' : '') + '>' + esc(m.name || '未命名') + '</label>'; }).join('') + '</div></td>' +
      '<td class="w-xs">' + xBtn('bills', b.id) + '</td></tr>';
  }).join('');
  var rates = '<span>记账主币种</span><input class="cc" id="baseCur" value="' + esc(T.base) + '"><span>· 汇率（1 外币 = ? ' + esc(T.base) + '）</span>' +
    Object.keys(T.rates).map(function (c) { return '<span><b>' + esc(c) + '</b> <input data-rate="' + esc(c) + '" value="' + esc(T.rates[c]) + '"> <button class="x" data-act="delrate" data-c="' + esc(c) + '">×</button></span>'; }).join('') +

    (rows ? '<tr><th>项目</th><th>金额</th><th>币种</th><th>谁付</th><th>参与</th><th></th></tr>' + rows : '<tr><td class="empty">还没有账目。</td></tr>') +
    '</table></div><button class="add" data-act="addbill">+ 一笔</button><div id="settle">' + settleHtml() + '</div></div>';
};
function toBase(b) { var a = parseFloat(String(b.amt).replace(/,/g, '')) || 0, c = (b.cur || T.base).toUpperCase(); if (c === T.base) return a; var r = parseFloat(T.rates[c]); return r ? a * r : 0; }
function money(n) { return (Math.round(n * 100) / 100).toLocaleString('zh-CN', { maximumFractionDigits: 2 }); }
function settleHtml() {
  var ms = T.members, net = {}, share = {}, total = 0;
  ms.forEach(function (m) { net[m.id] = 0; share[m.id] = 0; });
  T.bills.forEach(function (b) {
    var a = toBase(b), ps = b.parts.filter(function (p) { return p in net; }); if (!a || !ps.length) return;
    total += a; if (b.payer in net) net[b.payer] += a;
    ps.forEach(function (p) { share[p] += a / ps.length; net[p] -= a / ps.length; });
  });
  var cr = [], db = [];
  ms.forEach(function (m) { var v = Math.round(net[m.id] * 100) / 100; if (v > 0.009) cr.push([m.id, v]); else if (v < -0.009) db.push([m.id, -v]); });
  cr.sort(function (a, b) { return b[1] - a[1]; }); db.sort(function (a, b) { return b[1] - a[1]; });
  var tx = [], i = 0, j = 0;
  while (i < db.length && j < cr.length) { var x = Math.min(db[i][1], cr[j][1]); tx.push([db[i][0], cr[j][0], x]); db[i][1] -= x; cr[j][1] -= x; if (db[i][1] < 0.01) i++; if (cr[j][1] < 0.01) j++; }
  return '<div class="sum"><div><span>总花费</span><b>' + money(total) + ' ' + esc(T.base) + '</b></div><div><span>人均</span><b>' + money(ms.length ? total / ms.length : 0) + '</b></div><div><span>我应付</span><b>' + (hasMe() ? money(share[ME] || 0) : '—') + '</b></div></div>' +
    '<ul class="settle">' + (tx.length ? tx.map(function (t) { return '<li><b>' + esc(memName(t[0])) + '</b> → <b>' + esc(memName(t[1])) + '</b>　' + money(t[2]) + ' ' + esc(T.base) + '</li>'; }).join('') : '<li class="meta">目前无需转账</li>') + '</ul>';
}
V.note = function () { return '<div class="card"><textarea data-meta="notes" placeholder="集合时间、紧急联系人、大使馆电话、酒店 Wi-Fi 密码、碎碎念…">' + esc(T.notes) + '</textarea></div>'; };

/* ================= 交互 ================= */

  if (el.id === 'newCur') { var n = el.value.trim().toUpperCase(); if (/^[A-Z]{3}$/.test(n) && n !== T.base) { set('r|' + n, T.base === 'CNY' && CURS[n] ? CURS[n] : ''); build(); } renderView(); return; }

  if ((a === 'toDay' || a === 'pickwish') && el.value) {

    add('items', { day: day, what: w.name, where: w.where || w.name, wish: w.id }); renderView(); if (a === 'toDay') toast('已排进日程'); return;
  }

    var f = el.dataset.f, l = el.dataset.l;

  }
});
function refreshSettle() { var s = $('#settle'); if (s) s.innerHTML = settleHtml(); }
function midOrder(list, afterIdx) { var a = list[afterIdx], b = list[afterIdx + 1]; if (!a) return undefined; return b ? (a._o + b._o) / 2 : a._o + 1; }
document.addEventListener('click', function (e) {
  if (e.target.closest('[data-close]') || e.target.classList.contains('modal')) { document.querySelectorAll('.modal').forEach(function (m) { m.hidden = true; }); return; }
  if (!T || !$('#app').contains(e.target)) return;

  var a = b.dataset.act, id = b.dataset.id;

    setme: function () { setMe(id); renderMems(); renderView(); },

    addcat: function () { var c = prompt('分类名'); if (c) { add('pack', { cat: c }); renderView(); } },
    pst: function () { var p = find('pack', id); setF('pack', id, 'st|' + b.dataset.m, ((p.st[b.dataset.m] || 0) + 1) % 3); renderView(); },
    pdone: function () { var p = find('pack', id); setF('pack', id, 'st|done', !p.st.done); renderView(); },

    addbill: function () { add('bills', { cur: Object.keys(T.rates)[0] || T.base, payer: hasMe() ? ME : '', parts: T.members.map(function (m) { return m.id; }) }); renderView(); },
    delrate: function () { set('r|' + b.dataset.c, null); build(); renderView(); },

    io: function () { $('#ioM').hidden = false; }
  };
  if (acts[a]) acts[a]();
});

function copy(s) { (navigator.clipboard ? navigator.clipboard.writeText(s) : Promise.reject()).then(function () { toast('已复制'); }, function () { prompt('复制下面的内容', s); }); }

/* ================= 首页 / 路由 ================= */
